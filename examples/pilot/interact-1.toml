agents = 4
experiment_budget = 12
max_turns = 80
timeout_seconds = 1800
runs_visibility = "all"
notes_visibility = "all"
note_timestamps = true
experiment_duration_seconds = 15.0
start_offsets_seconds = [0, 0, 0, 0]

[harness]
kind = "openai"
# Explicit and replaceable; availability depends on your API account.
model = "gpt-6.1-sol"
reasoning_summary = "auto"

[task]
instructions_file = "interact.txt"
kind = "synthetic"
dimensions = 8
objective_seed = 42
noise_seed = 123
noise_std = 0.1
