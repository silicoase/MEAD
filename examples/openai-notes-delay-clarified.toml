agents = 3
experiment_budget = 8
max_turns = 80
timeout_seconds = 1200
runs_visibility = "all"
notes_visibility = "all"
experiment_duration_seconds = 15.0
start_offsets_seconds = [0, 30, 60]

[harness]
kind = "openai"
# Explicit and replaceable; availability depends on your API account.
model = "gpt-5.4"

[task]
instructions_file = "notebook-instructions.txt"
kind = "synthetic"
dimensions = 8
objective_seed = 42
noise_seed = 123
noise_std = 0.1
