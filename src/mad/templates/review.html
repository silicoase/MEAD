<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{border:1px solid var(--border);border-radius:7px;background:var(--surface);padding:8px 13px}button:hover{background:var(--soft)}a{color:var(--accent)}header{background:var(--surface);border-bottom:1px solid var(--border)}.header-inner{max-width:1440px;margin:auto;padding:24px 32px;display:flex;align-items:center;gap:18px}.brand{font-size:14px;font-weight:500;border:1px solid var(--border);padding:10px;border-radius:6px}.heading{flex:1;min-width:0}.eyebrow{color:var(--muted);font-size:14px;font-weight:500}h1{font-size:16px;line-height:1.25;margin:3px 0 4px;letter-spacing:-.04em}h2{font-size:16px;margin:0 0 14px;letter-spacing:-.02em}h3{font-size:14px;margin:0 0 10px}.run-name{font:13px ui-monospace,SFMono-Regular,monospace;color:var(--muted);overflow-wrap:anywhere}.badge{display:inline-block;padding:4px 9px;border-radius:5px;background:var(--soft);color:var(--accent);font-size:14px}.muted{color:var(--muted)}.small{font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1440px;margin:auto;min-height:70vh}.sidebar{padding:26px 20px;border-right:1px solid var(--border)}nav{display:flex;flex-direction:column;gap:5px;margin-bottom:28px}nav button{text-align:left;background:transparent;border-color:transparent;padding:11px 12px}nav button.active{background:var(--soft);color:var(--accent);font-weight:500}.sidebar label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}select,input[type=search]{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 10px;max-width:100%}.sidebar select{width:100%}.side-note{font-size:14px;color:var(--muted);margin-top:24px}.main{padding:28px 32px;min-width:0}.section-intro{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:18px}.section-intro h2{margin-bottom:4px}.section-intro p{margin:0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px}.card .label{font-size:14px;color:var(--muted)}.big{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;margin:10px 0}.card footer{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);gap:8px}.stack{display:grid;gap:20px}.spaced{margin-top:20px}.two-cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(230px,1fr);gap:18px}.notice{padding:12px 15px;background:var(--warn-bg);color:var(--warn);border-radius:7px;font-size:14px;margin-bottom:18px}.chart{width:100%;height:240px;display:block}.chart text{fill:var(--muted);font:13px system-ui,sans-serif}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:6px}.swatch{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px}.stat-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}.stat-row:last-child{border:0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:170px}.count{margin-left:auto;font-size:14px;color:var(--muted)}details{border-bottom:1px solid var(--border)}summary{cursor:pointer;padding:14px 0;list-style:none;display:flex;gap:13px;align-items:start}summary::-webkit-details-marker{display:none}summary:before{content:'›';color:var(--muted);font-size:14px;line-height:20px}details[open]>summary:before{transform:rotate(90deg)}.time{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);font-size:14px;width:56px;flex-shrink:0}.event-title{flex:1;min-width:0}.event-title strong{font-size:14px;font-weight:500;display:block;overflow-wrap:anywhere}.event-description{font-size:14px;color:var(--muted);overflow-wrap:anywhere}.agent-tag{white-space:nowrap;font-size:14px;border:1px solid var(--border);padding:2px 7px;border-radius:4px}.event-content{padding:0 0 16px 26px;min-width:0}.event-content h3{margin-top:16px}.event-content h3:first-child{margin-top:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code);border-radius:7px;padding:14px;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;margin:6px 0 12px;max-height:560px;overflow:auto}.event-content pre{max-height:380px}.focused{background:var(--soft);border-radius:6px;padding:0 10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th{font-size:14px;color:var(--muted);font-weight:500}th,td{padding:11px 9px;border-bottom:1px solid var(--border)}td{font-variant-numeric:tabular-nums}.empty{padding:30px 16px;color:var(--muted);font-size:14px;text-align:center}.flag{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;border-bottom:1px solid var(--border);padding:15px 0}.flag strong{display:block;font-size:14px}.flag p{font-size:14px;color:var(--muted);margin:5px 0}.flag code{overflow-wrap:anywhere}.definition{margin-bottom:16px}.definition summary{padding:12px 0}.footer-note{font-size:14px;color:var(--muted);margin:18px 0}.load-more{display:block;margin:18px auto}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-head h2{margin:0}.panel-head button{font-size:14px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1000px){.two-cols{grid-template-columns:1fr}.shell{grid-template-columns:180px minmax(0,1fr)}.main{padding:24px 20px}.header-inner{padding:20px}}
@media(max-width:680px){.shell{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--border);padding:14px 16px}.sidebar nav{flex-direction:row;overflow:auto;margin-bottom:14px;gap:3px}nav button{white-space:nowrap;padding:8px 10px;font-size:14px}.sidebar label{display:inline;margin-right:10px}.sidebar select{width:auto}.side-note{display:none}.main{padding:20px 14px}.header-inner{padding:18px 14px;gap:10px}.brand{display:none}h1{font-size:16px}.card,.panel{padding:16px}.time{width:44px}.agent-tag{font-size:14px}.flag{grid-template-columns:1fr}.header-inner>.badge{display:none}.grid{grid-template-columns:1fr}.event-content{padding-left:8px}}

.context-stats th,.context-stats td{white-space:nowrap}.context-summary{margin-bottom:18px}.context-summary p{margin:6px 0}.swatch{height:0;background:none!important;border-top:2px solid var(--accent)}.notice{border-left:2px solid var(--accent)}h1,h2,h3,.brand{color:var(--accent)}.silicoase-logo{display:block;flex-shrink:0}.run-title{color:var(--ink);font-size:14px;font-weight:500;line-height:1.6;letter-spacing:normal;margin:0;overflow-wrap:anywhere}

<div class="shell"><aside class="sidebar"><nav aria-label="Run views" id="navigation"></nav><label for="scope">Agent scope</label><select id="scope"></select></aside><main class="main" id="content" aria-live="polite"></main></div>
<script id="run-data" type="application/json">__MAD_RUN_DATA__</script>
<script>
'use strict';
const run=JSON.parse(document.getElementById('run-data').textContent);
const events=run.events||[], config=run.config||{}, reports=run.summary.agents||[];
const agents=Array.from({length:config.agents||0},(_,i)=>i);
let activeTab='overview', selected='all', query='', kind='all', shown=80, focusSequence=null;
const fmt=(value,digits=4)=>typeof value==='number'?value.toFixed(digits):'—';
const pretty=value=>typeof value==='string'?value:JSON.stringify(value,null,2);
function el(tag,attrs={},...children){const node=document.createElement(tag);for(const [key,value] of Object.entries(attrs)){if(key==='class')node.className=value;else if(key.startsWith('on'))node.addEventListener(key.slice(2),value);else node.setAttribute(key,value);}for(const child of children.flat()){if(child!==null&&child!==undefined)node.append(child instanceof Node?child:document.createTextNode(String(child)));}return node;}
function pre(value){return el('pre',{},pretty(value));}
const content=document.getElementById('content');
const matches=e=>selected==='all'||e.agent===Number(selected);
const visibleAgents=()=>selected==='all'?agents:[Number(selected)];
const selectedEvents=()=>events.filter(matches);
const tools=()=>selectedEvents().filter(e=>e.kind==='tool_called');
const responses=()=>selectedEvents().filter(e=>e.kind==='model_response');
const colors=['var(--accent)'];
const lineStyles=['','7 4','2 4','10 3 2 3'];
const pairs=new Map(), pending=new Map();
for(const event of events){if(event.kind==='tool_called')pending.set(event.agent,event.sequence);if(event.kind==='tool_result'&&pending.has(event.agent)){pairs.set(pending.get(event.agent),event);pending.delete(event.agent);}}
const tabs=[['overview','Overview'],['timeline','Trajectories'],['context','Context growth'],['setup','Prompts & tools'],['experiments','Experiments'],['evidence','Possible coordination'],['artifacts','Artifacts']];
function setTab(tab){activeTab=tab;shown=80;render();}
for(const [id,label] of tabs){document.getElementById('navigation').append(el('button',{type:'button','data-tab':id,onclick:()=>setTab(id)},label));}
const scope=document.getElementById('scope');scope.append(el('option',{value:'all'},'All agents'),...agents.map(i=>el('option',{value:String(i)},'Agent '+i)));
scope.addEventListener('change',()=>{selected=scope.value;shown=80;render();});
document.getElementById('run-title').textContent='Measuring agent discovery (MAD) | Run '+run.name;
function jump(sequence,agent){activeTab='timeline';selected=String(agent);scope.value=selected;query='';kind='all';shown=events.length;focusSequence=sequence;render();const target=document.getElementById('event-'+sequence);if(target){target.open=true;target.scrollIntoView({block:'center',behavior:'smooth'});}}
function eventLink(sequence,agent,label='Inspect evidence'){return el('button',{type:'button',onclick:()=>jump(sequence,agent)},label);}
function addNotices(){for(const notice of run.notices||[])content.append(el('div',{class:'notice'},notice));}
function render(){for(const button of document.querySelectorAll('nav button')){button.classList.toggle('active',button.dataset.tab===activeTab);button.setAttribute('aria-current',button.dataset.tab===activeTab?'page':'false');}content.replaceChildren();({overview,timeline,context,setup,experiments,evidence,artifacts}[activeTab])();content.append(el('p',{class:'footer-note'},'File access inside Python is not logged individually.'));}
function agentCards(){return el('div',{class:'grid'},...visibleAgents().map(i=>{const report=reports.find(a=>a.agent===i)||{};const used=report.experiments_used??events.filter(e=>e.agent===i&&e.kind==='experiment_started').length;return el('article',{class:'card'},el('div',{class:'panel-head'},el('h3',{},'Agent '+i),el('span',{class:'badge'},report.reason||'In progress')),el('div',{class:'spaced'},'Final score: '+fmt(report.true_objective)),typeof report.true_objective==='number'&&run.objective_reference?el('div',{},'Gap to estimated maximum: '+fmt(run.objective_reference.estimated_maximum-report.true_objective)):null,el('div',{},'Best observation: '+fmt(report.best_observed)),el('div',{class:'spaced'},`${used}/${config.experiment_budget} experiments`),el('div',{},`${events.filter(e=>e.agent===i&&e.kind==='model_response').length} model turns`));}));}
function chart(){const wrapper=el('div',{});const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');const width=Math.max(300,Math.min(700,window.innerWidth-(window.innerWidth>1000?324:window.innerWidth>680?252:60)));svg.setAttribute('viewBox',`0 0 ${width} 240`);svg.setAttribute('class','chart');svg.setAttribute('role','img');svg.setAttribute('aria-label','Best observed noisy objective by elapsed time for selected agents');const append=(tag,attrs,text)=>{const node=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));if(text!==undefined)node.textContent=text;svg.append(node);return node;};const points=selectedEvents().filter(e=>e.kind==='experiment_completed');if(!points.length)return el('div',{class:'empty'},'No completed measurements recorded.');const xs=points.map(e=>e.elapsed_seconds),ys=points.map(e=>e.record.observed);const maximum=run.objective_reference?.estimated_maximum;if(Number.isFinite(maximum))ys.push(maximum);const xmax=Math.max(...xs,1), ymin=Math.min(...ys),ymax=Math.max(...ys),span=ymax-ymin||1;const X=x=>55+x/xmax*(width-80),Y=y=>200-(y-ymin+span*.08)/(span*1.16)*170;for(let i=0;i<4;i++){const y=ymin+span*i/3;append('line',{x1:55,x2:width-25,y1:Y(y),y2:Y(y),stroke:'var(--border)'});append('text',{x:45,y:Y(y)+4,'text-anchor':'end'},y.toFixed(2));}for(let i=0;i<5;i++){const x=xmax*i/4;append('text',{x:X(x),y:220,'text-anchor':'middle'},x.toFixed(1)+'s');}append('text',{x:width/2,y:239,'text-anchor':'middle'},'Elapsed rollout time');for(const agent of visibleAgents()){const series=points.filter(e=>e.agent===agent).sort((a,b)=>a.sequence-b.sequence);let best=-Infinity,path='';for(const [index,event] of series.entries()){best=Math.max(best,event.record.observed);path+=(index?' H ':'M ')+X(event.elapsed_seconds)+(index?' V ':' ')+Y(best);}append('path',{d:path,fill:'none',stroke:colors[0],'stroke-width':2,'stroke-dasharray':lineStyles[agent%lineStyles.length]});let top=-Infinity;for(const event of series){top=Math.max(top,event.record.observed);const circle=append('circle',{cx:X(event.elapsed_seconds),cy:Y(top),r:3.5,fill:colors[0]});const title=document.createElementNS(ns,'title');title.textContent=`Agent ${agent} · ${event.elapsed_seconds.toFixed(2)}s · best observed ${top.toFixed(4)}`;circle.append(title);}}if(Number.isFinite(maximum)){append('line',{x1:55,x2:width-25,y1:Y(maximum),y2:Y(maximum),stroke:'var(--muted)','stroke-width':1,'stroke-dasharray':'4 4','data-role':'estimated-maximum'});append('text',{x:55,y:Y(maximum)-6,'text-anchor':'start'},'Estimated max '+fmt(maximum));svg.setAttribute('aria-label',svg.getAttribute('aria-label')+'; estimated noise-free maximum '+fmt(maximum));}wrapper.append(svg,el('div',{class:'legend'},...visibleAgents().map(i=>el('span',{},el('span',{class:'swatch',style:'border-top-style:'+(i%lineStyles.length===0?'solid':i%lineStyles.length===1?'dashed':'dotted')}),'Agent '+i))));return wrapper;}
function overview(){if(run.objective_reference)content.append(el('p',{},'Estimated maximum score: '+fmt(run.objective_reference.estimated_maximum)));if(config.harness?.kind==='scripted')content.append(el('div',{class:'notice'},'This run used scripted agents.'));content.append(agentCards());const calls=tools(), tokens=responses().reduce((n,e)=>n+(e.usage?.total_tokens||0),0);const breakdown=el('div',{class:'panel'},el('h2',{},'What was recorded'));for(const [label,value] of [['Total recorded events',events.length],['Experiment calls',calls.filter(e=>e.tool==='experiment').length],['Python calls',calls.filter(e=>e.tool==='python').length],['File reads',calls.filter(e=>e.tool==='read_file').length],['Note writes',calls.filter(e=>['write_file','append_file'].includes(e.tool)&&e.arguments?.path?.startsWith('/lab/notes/')).length],['Reported model tokens',tokens.toLocaleString()],['Possible coordination flags',run.flags.filter(matches).length]])breakdown.append(el('div',{class:'stat-row'},label,el('span',{},value)));const panel=el('div',{class:'panel'},el('h2',{},'Best observed measurement'),el('p',{class:'small muted'},'Noisy observations; these are not final true objective values.'),chart());content.append(el('div',{class:'two-cols spaced'},panel,breakdown));}
function describe(event){if(event.kind==='tool_called'){const args=event.arguments||{};return [event.tool,args.path|| (event.tool==='experiment'?JSON.stringify(args.parameters):event.tool==='submit'?'Final configuration':event.tool==='python'?(args.code||'').split('\n')[0]:'')];}if(event.kind==='model_response'){const types=(event.output||[]).map(x=>x.type==='function_call'?'Request '+x.name:x.type);return ['Model response',types.join(' · ')+(typeof event.usage?.input_tokens==='number'?' · '+event.usage.input_tokens.toLocaleString()+' input tokens':'')];}if(event.kind==='model_request')return ['Model request','System prompt and full input history'];if(event.kind.startsWith('experiment_'))return [event.kind==='experiment_started'?'Experiment accepted':'Measurement available',event.record?.run_id||''];if(event.kind==='submission')return ['Final configuration submitted',JSON.stringify(event.parameters)];return [event.kind.replaceAll('_',' '),event.report?.reason||''];}
function eventDetails(event){const div=el('div',{class:'event-content'});if(event.kind==='tool_called'){div.append(el('h3',{},'Arguments'),pre(event.arguments));const response=pairs.get(event.sequence);div.append(el('h3',{},'Result'),response?pre(response.result):el('p',{class:'muted'},'No completed result recorded.'));}else if(event.kind==='model_request'){div.append(el('h3',{},'System prompt'),pre(event.system_prompt),el('h3',{},'Input history'),pre(event.input_items));}else if(event.kind==='model_response'){for(const output of event.output||[]){if(output.type==='message'){div.append(el('h3',{},output.role||'Message'),pre((output.content||[]).map(c=>c.text||c.refusal||pretty(c)).join('\n')));}else if(output.type==='reasoning'){const summary=(output.summary||[]).map(item=>item.text||'').filter(Boolean);if(summary.length)div.append(el('h3',{},'Reasoning summary'),pre(summary.join('\n\n')));}else if(output.type==='function_call'){div.append(el('h3',{},'Tool request · '+output.name),pre(output.arguments));}else div.append(pre(output));}div.append(el('h3',{},'Usage and response ID'),pre({usage:event.usage,response_id:event.response_id}));}else div.append(pre(event));div.append(el('div',{class:'small muted'},`Event #${event.sequence} · ${event.timestamp}`));return div;}
function timeline(){const search=el('input',{type:'search',placeholder:'Search events, code, paths, or text','aria-label':'Search trajectories',value:query});const category=el('select',{'aria-label':'Event category'},...['all','tools','models','experiments','lifecycle'].map(value=>el('option',{value},value==='all'?'All events':value[0].toUpperCase()+value.slice(1))));category.value=kind;const resultCount=el('span',{class:'count'});const list=el('div',{class:'panel'});const toolbar=el('div',{class:'toolbar'},search,category,resultCount);content.append(toolbar,list);const group=e=>e.kind==='tool_called'?'tools':e.kind.startsWith('model_')?'models':e.kind.startsWith('experiment_')?'experiments':'lifecycle';function update(){const filtered=selectedEvents().filter(e=>!['tool_result','agent_interface'].includes(e.kind)&&(kind==='all'||group(e)===kind)&&(!query||JSON.stringify(e).toLowerCase().includes(query.toLowerCase())||JSON.stringify(pairs.get(e.sequence)||{}).toLowerCase().includes(query.toLowerCase())));resultCount.textContent=filtered.length+' events';list.replaceChildren();for(const event of filtered.slice(0,shown)){const [title,description]=describe(event);const details=el('details',{id:'event-'+event.sequence,class:event.sequence===focusSequence?'focused':''},el('summary',{},el('span',{class:'time'},fmt(event.elapsed_seconds,1)+'s'),el('span',{class:'event-title'},el('strong',{},title),el('span',{class:'event-description'},description)),el('span',{class:'agent-tag'},event.agent===null?'Run':'Agent '+event.agent)),eventDetails(event));list.append(details);}if(!filtered.length)list.append(el('div',{class:'empty'},'No events match this selection.'));if(filtered.length>shown)list.append(el('button',{type:'button',class:'load-more',onclick:()=>{shown+=80;update();}},'Show more events'));}search.addEventListener('input',()=>{query=search.value;shown=80;update();});category.addEventListener('change',()=>{kind=category.value;shown=80;update();});update();}
function contextChart(points){
  if(!points.length)return el('div',{class:'empty'},'No model-reported input tokens were recorded.');
  const ns='http://www.w3.org/2000/svg', svg=document.createElementNS(ns,'svg');
  const width=Math.max(300,Math.min(1000,window.innerWidth-(window.innerWidth>1000?324:window.innerWidth>680?252:60)));
  const height=270,left=64,right=width-22,top=20,bottom=220;
  svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('class','chart');
  svg.setAttribute('role','img');svg.setAttribute('aria-label','Model-reported input tokens per call over elapsed rollout time');
  const put=(tag,attrs,text)=>{const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;svg.append(n);return n;};
  const maxTime=Math.max(1,...points.map(p=>p.elapsed_seconds));
  const maxTokens=Math.max(1,...points.map(p=>p.input_tokens))*1.12;
  const X=value=>left+value/maxTime*(right-left),Y=value=>bottom-value/maxTokens*(bottom-top);
  for(let i=0;i<=4;i++){const value=maxTokens*i/4;put('line',{x1:left,x2:right,y1:Y(value),y2:Y(value),stroke:'var(--border)'});put('text',{x:left-10,y:Y(value)+4,'text-anchor':'end'},Math.round(value).toLocaleString());}
  const ticks=width<500?3:5;
  for(let i=0;i<ticks;i++){const value=maxTime*i/(ticks-1);put('text',{x:X(value),y:242,'text-anchor':'middle'},value.toFixed(1)+'s');}
  put('text',{x:width/2,y:266,'text-anchor':'middle'},'Elapsed rollout time');
  for(const agent of visibleAgents()){
    const series=points.filter(p=>p.agent===agent);
    if(!series.length)continue;
    put('path',{d:series.map((p,i)=>(i?'L':'M')+' '+X(p.elapsed_seconds)+' '+Y(p.input_tokens)).join(' '),fill:'none',stroke:'var(--accent)','stroke-width':2,'stroke-dasharray':lineStyles[agent%lineStyles.length]});
    for(const point of series){
      const marker=put('circle',{cx:X(point.elapsed_seconds),cy:Y(point.input_tokens),r:3,fill:'var(--accent)'});
      const title=document.createElementNS(ns,'title');title.textContent=`Agent ${agent} · turn ${point.turn} · ${point.input_tokens.toLocaleString()} input tokens`;
      marker.append(title);
    }
  }
  return el('div',{},svg,el('div',{class:'legend'},...visibleAgents().map(i=>el('span',{},el('span',{class:'swatch',style:'border-top-style:'+(i%lineStyles.length===0?'solid':i%lineStyles.length===1?'dashed':'dotted')}),'Agent '+i))));
}
function context(){
  const points=(run.context||[]).filter(matches);
  const totals=el('table',{class:'context-stats'},el('thead',{},el('tr',{},...['Agent','First call','Latest call','Peak input','Cumulative input'].map(h=>el('th',{},h)))),el('tbody'));
  const body=totals.querySelector('tbody');
  for(const agent of visibleAgents()){
    const series=points.filter(p=>p.agent===agent);
    const values=series.map(p=>p.input_tokens);
    const row=[`Agent ${agent}`,series.length?series[0].input_tokens.toLocaleString():'—',series.length?series.at(-1).input_tokens.toLocaleString():'—',series.length?Math.max(...values).toLocaleString():'—',series.length?series.at(-1).cumulative_input_tokens.toLocaleString():'—'];
    body.append(el('tr',{},...row.map(value=>el('td',{},value))));
  }
  content.append(el('div',{class:'panel context-summary'},el('h2',{},'Input tokens'),el('div',{class:'table-wrap'},totals),el('p',{class:'muted'},'Peak input is a context-load indicator. Cumulative input counts repeated processing across calls; it is not the size of a single context.')));
  content.append(el('div',{class:'panel'},contextChart(points)));
  const calls=el('table',{},el('thead',{},el('tr',{},...['Agent','Turn','Time','Input','Output','Cached input','Evidence'].map(h=>el('th',{},h)))),el('tbody'));
  for(const point of points){calls.querySelector('tbody').append(el('tr',{},el('td',{},'Agent '+point.agent),el('td',{},point.turn),el('td',{},fmt(point.elapsed_seconds,1)+'s'),el('td',{},point.input_tokens.toLocaleString()),el('td',{},typeof point.output_tokens==='number'?point.output_tokens.toLocaleString():'—'),el('td',{},typeof point.cached_tokens==='number'?point.cached_tokens.toLocaleString():'—'),el('td',{},eventLink(point.sequence,point.agent,'Inspect'))));}
  content.append(el('div',{class:'panel spaced'},el('h2',{},'Per-call usage'),el('div',{class:'table-wrap'},calls)),el('p',{class:'footer-note'},'Request-start times are used when recorded. In-flight or failed calls without usage are not included. Input tokens are a provider-reported proxy for context load; output tokens also need room within the model limits.'));
}

function setup(){const metadata=el('div',{class:'panel'},el('h2',{},'Run details'));for(const [label,value] of [['Harness',config.harness?.kind||'Unknown'],['Model',config.harness?.kind==='openai'?config.harness.model:'Scripted smoke test']])metadata.append(el('div',{class:'stat-row'},label,el('span',{},value)));content.append(metadata);addNotices();for(const agent of visibleAgents()){const record=run.interfaces[String(agent)]||{};const details=el('details',{class:'panel spaced'},el('summary',{},el('span',{class:'event-title'},el('strong',{},'Agent '+agent+' · system prompt and tools'),el('span',{class:'event-description'},record.source||'Not recorded'))));if(agent===visibleAgents()[0])details.open=true;const body=el('div',{class:'event-content'},el('h3',{},'Initial system prompt'),pre(record.instructions||'Not recorded'));const promptEvents=events.filter(e=>e.agent===agent&&e.kind==='model_request');const distinct=[...new Set(promptEvents.map(e=>e.system_prompt))];if(distinct.length>1){body.append(el('h3',{},'Additional system prompt variants'),...distinct.slice(1).map(pre));}body.append(el('h3',{},'Available tools'));for(const tool of record.tools||[]){body.append(el('details',{class:'definition'},el('summary',{},el('span',{class:'event-title'},el('strong',{class:'mono'},tool.name),el('span',{class:'event-description'},(tool.description||'').split('\n')[0]))),el('div',{class:'event-content'},pre(tool.description),pre(tool.parameters))));}if(record.provider_response_id)body.append(el('details',{},el('summary',{},'Recovery provenance'),pre({response_id:record.provider_response_id,model:record.provider_model,created_at:record.provider_created_at,retrieved_at:record.retrieved_at})));body.append(el('h3',{},'Initial user message'),pre(promptEvents[0]?.input_items||'No model request recorded.'));details.append(body);content.append(details);}content.append(el('details',{class:'panel spaced'},el('summary',{},'Resolved configuration and runtime'),el('div',{class:'event-content'},el('h3',{},'Configuration'),pre(config),el('h3',{},'Runtime'),pre(run.runtime),...(run.identities?.length?[el('h3',{},'Author IDs'),pre(run.identities)]:[]))));}
function experiments(){const table=el('table',{},el('thead',{},el('tr',{},...['Agent','Time','Observed','Configuration','Evidence'].map(h=>el('th',{},h)))),el('tbody'));const tbody=table.querySelector('tbody');for(const event of selectedEvents().filter(e=>e.kind==='experiment_completed'))tbody.append(el('tr',{},el('td',{},'Agent '+event.agent),el('td',{},fmt(event.elapsed_seconds,1)+'s'),el('td',{},fmt(event.record.observed)),el('td',{class:'mono'},event.record.parameters.map(x=>fmt(x,3)).join(', ')),el('td',{},eventLink(event.sequence,event.agent,'Inspect'))));content.append(el('div',{class:'panel'},el('h2',{},'Observed measurements'),el('div',{class:'table-wrap'},table)));const submissions=selectedEvents().filter(e=>e.kind==='submission');content.append(el('div',{class:'panel spaced'},el('h2',{},'Submitted configurations'),...submissions.map(event=>{const report=reports.find(a=>a.agent===event.agent);return el('div',{class:'flag'},el('div',{},el('strong',{},'Agent '+event.agent+' · true objective '+fmt(report?.true_objective)),pre(event.parameters)),eventLink(event.sequence,event.agent));}),...(!submissions.length?[el('p',{class:'muted'},'No submissions recorded.')]:[])));}
function evidence(){const flags=run.flags.filter(matches);const panel=el('div',{class:'panel'});for(const flag of flags){panel.append(el('div',{class:'flag'},el('div',{},el('strong',{},flag.label),el('p',{},`Agent ${flag.agent} · peer ${Array.isArray(flag.peer)?flag.peer.join(', '):flag.peer}`),el('code',{class:'small'},typeof flag.detail==='string'?flag.detail:JSON.stringify(flag.detail)),el('p',{},flag.strength)),eventLink(flag.sequence,flag.agent)));}if(!flags.length)panel.append(el('div',{class:'empty'},'No candidate indicators found in the available evidence.'));content.append(panel,el('p',{class:'footer-note'},'Current indicators: successful reads of peer-owned notes or measurements, notes mentioning a peer filename, and submissions matching configurations previously measured only by peers.'));}
function artifacts(){const search=el('input',{type:'search',placeholder:'Filter artifact paths','aria-label':'Filter artifacts'});const panel=el('div',{class:'panel'});content.append(el('div',{class:'toolbar'},search),panel);function update(){panel.replaceChildren();const items=run.artifacts.filter(a=>a.path.toLowerCase().includes(search.value.toLowerCase())&&(selected==='all'||!a.path.startsWith('work/')||a.path.startsWith('work/'+selected+'/')));for(const item of items){const details=el('details',{},el('summary',{},el('span',{class:'event-title'},el('strong',{class:'mono'},item.path),el('span',{class:'event-description'},`${item.bytes.toLocaleString()} bytes · owner UID ${item.uid}`))),el('div',{class:'event-content'},item.symlink?pre('Symlink → '+item.symlink):item.text!==undefined?pre(item.text):el('p',{class:'muted'},'Preview unavailable: binary or size limit. See artifacts.tar.')));panel.append(details);}if(!items.length)panel.append(el('div',{class:'empty'},'No artifact previews match this selection.'));}search.addEventListener('input',update);update();}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,120);});
render();
