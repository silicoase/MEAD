[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "measuring-agent-discovery"
version = "0.1.0"
description = "Configurable rollouts for measuring emergent agent discovery"
requires-python = ">=3.11"
dependencies = ["openai-agents>=0.23.1,<0.24", "pydantic>=2.11,<3", "python-dotenv>=1,<2"]

[project.scripts]
mad = "mad.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/mad"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["docker: integration tests requiring the Docker daemon and MAD image"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
